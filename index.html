<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon-coffee.svg">
    <title>Daily Random Picker IA</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400&display=swap" rel="stylesheet">
    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #222;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255,255,255,0.97);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(80,80,160,0.18);
            padding: 2.5rem 2rem;
            max-width: 520px;
            width: 100%;
            margin: 2rem auto;
            text-align: center;
        }
        h1 {
            font-size: 2.3rem;
            margin-bottom: 1rem;
            color: #2575fc;
            letter-spacing: 1px;
        }
        p {
            color: #444;
            font-size: 1.1rem;
        }
        #timer {
            font-size: 4rem;
            font-weight: 700;
            color: #6a11cb;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .predefined-btn {
            background: linear-gradient(90deg, #3498db 0%, #6a11cb 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            margin: 4px 2px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(80,80,160,0.08);
        }
        .predefined-btn:hover {
            background: linear-gradient(90deg, #6a11cb 0%, #3498db 100%);
            transform: scale(1.05);
        }
        .predefined-btn.selected {
            background: #95a5a6 !important;
            color: #fff !important;
            cursor: pointer !important;
            opacity: 0.8;
        }
        button {
            background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 8px 4px;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(80,80,160,0.1);
        }
        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        #current {
            font-size: 2em;
            font-weight: bold;
            color: #6a11cb;
            margin: 24px 0 12px 0;
            min-height: 1.2em;
            letter-spacing: 2px;
        }
        #remaining {
            font-size: 1rem;
            color: #2575fc;
            margin-bottom: 8px;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #fff;
            opacity: 0.8;
        }
        @media (max-width: 600px) {
            .container {
                padding: 1.2rem 0.5rem;
            }
            h1 {
                font-size: 1.4rem;
            }
            #current {
                font-size: 1.1rem;
            }
        }
        #btnPick {
            display: block;
            width: 80%;
            max-width: 340px;
            margin: 0.8rem auto 0.5rem auto;
            font-size: 1.5rem;
            padding: 1.2rem 0;
            font-weight: 700;
            letter-spacing: 1px;
        }
        #btnReset {
            display: block;
            width: 50%;
            max-width: 130px;
            margin: 1.5rem auto 0 auto;
            font-size: 14px;
            padding: 0.6rem 0;
        }
        .select-all-link {
            display: block;
            text-align: center;
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #2575fc;
            cursor: pointer;
            letter-spacing: 0.5px;
            user-select: none;
            transition: color 0.2s;
        }
        .select-all-link:hover {
            color: #6a11cb;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Daily Baufest</h1>
        <p>Selecciona los participantes presentes:</p>
        <div id="timer">00:00</div>
        <div>
            <button id="btnAgus" class="predefined-btn" onclick="toggleName('Agus', this)">Agus</button>
            <button id="btnCarla" class="predefined-btn" onclick="toggleName('Carla', this)">Carla</button>
            <button id="btnDani" class="predefined-btn" onclick="toggleName('Dani', this)">Dani</button>
            <button id="btnHernan" class="predefined-btn" onclick="toggleName('Hernan', this)">Hernan</button>
            <button id="btnInaki" class="predefined-btn" onclick="toggleName('Iñaki', this)">Iñaki</button>
            <button id="btnLuis" class="predefined-btn" onclick="toggleName('Luis', this)">Luis</button>
            <button id="btnLeti" class="predefined-btn" onclick="toggleName('Leti', this)">Leti</button>
            <button id="btnLeo" class="predefined-btn" onclick="toggleName('Leo', this)">Leo</button>
            <button id="btnLidio" class="predefined-btn" onclick="toggleName('Lidio', this)">Lidio</button>
            <button id="btnLu" class="predefined-btn" onclick="toggleName('Lu', this)">Lu</button>
            <button id="btnMateo" class="predefined-btn" onclick="toggleName('Mateo', this)">Mateo</button>
            <button id="btnNico" class="predefined-btn" onclick="toggleName('Nico', this)">Nico</button>
        </div>
        <span class="select-all-link" onclick="selectAll()">Todos</span>
        <br>
        <button id="btnPick" onclick="pickNext()">¿Quién empieza?</button>
        <button id="btnReset" onclick="resetNames()">Reiniciar Lista</button>
        <div id="current">¿Quién empieza?</div>
        <div id="remaining"></div>
    </div>
    <div class="footer">
        &copy; 2026 Daily Random Picker. Created and Tested by NicoLopez.
    </div>
    <script>
        let availableNames = [];
        let specialName = null;
        let pickStarted = false;
        let timerInterval = null;
        let elapsed = 0;
        let startTime = null;

        function toggleName(name, button) {
            button.classList.toggle('selected');
            
            // Si la daily ya comenzó, agregar/remover la persona sin reiniciar
            if (pickStarted) {
                const btnPick = document.getElementById('btnPick');
                if (button.classList.contains('selected')) {
                    // Agregar persona a la lista disponible
                    if (name.toLowerCase() === 'leti') {
                        specialName = name;
                    } else {
                        availableNames.push(name);
                    }
                } else {
                    // Remover persona de la lista disponible
                    if (name.toLowerCase() === 'leti') {
                        specialName = null;
                    } else {
                        availableNames = availableNames.filter(n => n !== name);
                    }
                }
                updateRemaining();
                
                // Actualizar estado del botón según si hay personas disponibles
                const hasAvailable = availableNames.length > 0 || specialName;
                
                // Si no hay personas disponibles, mostrar "Terminar" y mantenerlo habilitado
                if (!hasAvailable) {
                    btnPick.textContent = "Terminar";
                    btnPick.disabled = false;
                    document.getElementById('remaining').innerText = "¡Todos han pasado!";
                } else {
                    // Si hay personas disponibles y el botón estaba en "Terminar", cambiar a "¡Siguiente Persona!"
                    if (btnPick.textContent === "Terminar") {
                        btnPick.textContent = "¡Siguiente Persona!";
                    }
                    btnPick.disabled = false;
                }
            } else {
                // Si no ha comenzado, hacer reset normal
                reset();
            }
        }

        function loadSelectedNames() {
            const selectedButtons = document.querySelectorAll('.predefined-btn.selected');
            let names = [...selectedButtons].map(btn => btn.textContent.trim());
            specialName = null;
            availableNames = [];
            names.forEach(name => {
                if (name.toLowerCase() === 'leti') {
                    specialName = name;
                } else {
                    availableNames.push(name);
                }
            });
        }

        function updateRemaining() {
            let remainingText = "Restantes: " + availableNames.length;
            if (specialName) {
                remainingText += " (más " + specialName + ")";
            }
            document.getElementById('remaining').innerText = remainingText;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            startTime = performance.now();
            timerInterval = setInterval(() => {
                elapsed = Math.floor((performance.now() - startTime) / 1000);
                document.getElementById('timer').innerText = formatTime(elapsed);
            }, 100);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function reset() {
            loadSelectedNames();
            document.getElementById('current').innerText = "Participantes";
            updateRemaining();
            document.getElementById('btnPick').disabled = (availableNames.length === 0 && !specialName);
            document.getElementById('btnPick').textContent = "¿Quién empieza?";
            stopTimer();
            document.getElementById('timer').innerText = "00:00";
            elapsed = 0;
            pickStarted = false;
        }

        function resetNames() {
            document.querySelectorAll('.predefined-btn').forEach(btn => btn.classList.remove('selected'));
            reset();
        }

        function pickNext() {
            const btnPick = document.getElementById('btnPick');
            
            // Si el botón dice "Terminar", solo detener timer y deshabilitar botón
            if (btnPick.textContent === "Terminar") {
                stopTimer();
                btnPick.disabled = true;
                return;
            }

            if (!pickStarted) {
                loadSelectedNames();
                startTimer();
                btnPick.textContent = "¡Siguiente Persona!";
                pickStarted = true;
            }
            if (availableNames.length === 0 && !specialName) {
                reset();
                if (availableNames.length === 0 && !specialName) return;
            }

            if (availableNames.length > 0) {
                const index = Math.floor(Math.random() * availableNames.length);
                const winner = availableNames.splice(index, 1)[0];
                document.getElementById('current').innerText = "👉 " + winner;
                updateRemaining();
                if (availableNames.length === 0 && !specialName) {
                    btnPick.textContent = "Terminar";
                    document.getElementById('remaining').innerText = "¡Todos han pasado!";
                }
            } else if (specialName) {
                document.getElementById('current').innerText = "👸" + specialName;
                specialName = null;
                btnPick.textContent = "Terminar";
                document.getElementById('remaining').innerText = "¡Todos han pasado!";
            }
        }

        function selectAll() {
            document.querySelectorAll('.predefined-btn').forEach(btn => btn.classList.add('selected'));
            reset();
        }

        window.onload = reset;
    </script>
</body>
</html>
